name: policy-pack
on: [push, pull_request]
permissions: {contents: read}
jobs:
  cli-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install kyverno CLI + conftest
        run: |
          curl -sSL https://github.com/kyverno/kyverno/releases/download/v1.19.1/kyverno-cli_v1.19.1_linux_x86_64.tar.gz | sudo tar xz -C /usr/local/bin kyverno
          curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v0.71.1/conftest_0.71.1_Linux_x86_64.tar.gz | sudo tar xz -C /usr/local/bin conftest
      - run: pip install pytest pyyaml
      - run: kyverno test tests
      - run: conftest verify -p rego
      - run: pytest -q tests
  kind-e2e:
    runs-on: ubuntu-latest
    needs: cli-tests
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with: {install_only: true}
      - run: pip install pyyaml && ./kind/e2e.sh
