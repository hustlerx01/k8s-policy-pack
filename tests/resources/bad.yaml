spec:
  securityContext: {runAsNonRoot: true}
  containers:
    - name: c
      image: nginx:1.27
      resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 128Mi}}
      securityContext: {capabilities: {add: [NET_ADMIN]}}
